# should run jest using pnpm
name: Jest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 20.x
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: Install dependencies
        run: |
          corepack add pnpm
          pnpm install
      - name: Run Jest
        run: pnpm test
